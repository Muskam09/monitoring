[pytest]
# Run `pytest -v` from the backend/ directory. We force the test root
# to tests/ so stray scripts at the project root are never collected,
# and we enable verbose, short-traceback output by default so the
# terminal report is easy to scan.
testpaths = tests
addopts = -v --tb=short --strict-markers --color=yes
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    # SQLAlchemy / passlib / bcrypt emit harmless deprecation noise
    # on modern Python + bcrypt 4.x — quiet it so the report stays clean.
    ignore::DeprecationWarning
